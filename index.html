];return `<div class="howto-overlay" onclick="if(event.target===this)closeHowTo()"><section class="howto-dialog" role="dialog" aria-modal="true" aria-label="วิธีการเล่น"><header class="howto-header"><div><h2>📖 วิธีการเล่น</h2><p>อ่านวิธีควบคุมมินิเกมและระวังท่าพิเศษของปลา</p></div><button class="btn ghost howto-close" onclick="closeHowTo()" aria-label="ปิด">✕</button></header><div class="howto-content"><h3>🎮 มินิเกมตกปลา</h3><div class="howto-games"><article class="howto-game"><svg class="howto-illustration" viewBox="0 0 320 100" role="img" aria-label="ภาพประกอบแถบเลื่อน"><rect x="12" y="28" width="296" height="44" rx="12" fill="#152736" stroke="#70d8ee" stroke-width="4"/><rect x="119" y="31" width="82" height="38" rx="8" fill="#fff"/><text x="163" y="57" text-anchor="middle" font-size="24">🐟</text><circle cx="243" cy="50" r="10" fill="#ffd75d"/><text x="160" y="92" text-anchor="middle" font-size="13" fill="#174968">ลาก/กดค้างไปขวา · ปล่อยให้ไหลกลับซ้าย</text></svg><b>1. แถบเลื่อน</b><p>กดค้างหรือลากเพื่อเลื่อนแถบสีขาวไปทางขวา ปล่อยแล้วแถบจะไหลกลับซ้าย พยายามให้แถบอยู่ตรงกับปลาเพื่อเพิ่ม Progression และหลบสัญญาณอันตราย</p></article><article class="howto-game"><svg class="howto-illustration" viewBox="0 0 320 100" role="img" aria-label="ภาพประกอบกดปุ่มเรียงลำดับ"><circle cx="80" cy="44" r="25" fill="#21a6d0" stroke="white" stroke-width="3"/><text x="80" y="52" text-anchor="middle" font-size="22" fill="white" font-weight="bold">1</text><circle cx="160" cy="44" r="25" fill="#ffca45" stroke="white" stroke-width="3"/><circle cx="160" cy="44" r="34" fill="none" stroke="#ffed8b" stroke-width="3"/><text x="160" y="52" text-anchor="middle" font-size="22" fill="#553800" font-weight="bold">2</text><circle cx="240" cy="44" r="25" fill="#21a6d0" stroke="white" stroke-width="3"/><text x="240" y="52" text-anchor="middle" font-size="22" fill="white" font-weight="bold">3</text><text x="160" y="92" text-anchor="middle" font-size="13" fill="#174968">กดหมายเลขที่สว่างก่อน วงแหวนกำลังนับ function ensurePlayerData(){if(!user)return;user.fishCollection ||= {};user.gardenSeeds ||= {};user.gardenPlots ||= [null,null];user.storeOwned ||= ['starter-outfit','starter-rod'];user.storeEquipped ||= {outfit:'starter-outfit',rod:'starter-rod',pet:null};user.storeOwned.push('starter-outfit','starter-rod');user.storeOwned=[...new Set(user.storeOwned)];user.storeEquipped.outfit ||= 'starter-outfit';user.storeEquipped.rod ||= 'starter-rod';user.coins=Number(user.coins)||0;user.badges ||= [];user.unlocked ||= [];user.equipped ||= {};user.soundEnabled=user.soundEnabled!==false;user.level=Math.max(1,Math.min(50,Math.floor(Number(user.level)||1)));user.exp=Math.max(0,Number(user.exp)||0);if(user.level>=50){user.level=50;user.exp=expForNextLevel(50)}else user.exp=Math.min(user.exp,expForNextLevel(user.level)-1);if(!user.daily||user.daily.day!==todayKey())user.daily={day:todayKey(),correct:0,caught:0,activity:0,claimed:[]};user.daily.claimed ||= [];for(const it of outfitItems)if(user.coins>=it.unlock&&!user.unlocked.includes(it.id))user.unlocked.push(it.id)}function questProgress(id){ensurePlayerData();if(!user)return;user.daily[id]=(user.daily[id]||0)+1;const q=dailyQuests.find(x=>x.id===id);if(q&&user.daily[id]>=q.target&&!user.daily.claimed.includes(id)){user.daily.claimed.push(id);const qCoins=grantCoins(q.reward);const ups=grantExperience(5);toast('ภารกิจสำเร็จ! +5 EXP'+(ups?' · เลเวล '+user.level+' 🎉':'')+' · รับ '+qCoins+' เหรียญ 🪙')}save()}function dailyBoard(){if(!user)return `<section class="panel quest-panel"><h2>🗓️ ภารกิจวันนี้</h2><p class="muted">เริ่มเล่นเมื่อพร้อม ภารกิจจะรอคุณอยู่เสมอ 🌱</p></section>`;ensurePlayerData();return `<section class="panel quest-panel"><div class="row spread"><div><h2>🗓️ ภารกิจวันนี้</h2><p class="muted">ทำตามจังหวะของคุณ รับเหรียญสะสมได้</p></div><div class="score">🪙 เหรียญ <b>${user.coins}</b></div></div><div class="quest-grid">${dailyQuests.map(q=>{const n=Math.min(user.daily[q.id]||0,q.target),done=user.daily.claimed.includes(q.id);return `<article class="quest-card ${done?'done':''}"><b>${done?'✅':'🎯'} ${q.label}</b><div class="progress"><i style="width:${n/q.target*100}%"></i></div><small>${n}/${q.target} ${q.unit} · รางวัล ${q.reward} เหรียญ</small></article>`}).join('')}</div><div class="smallnote">ภารกิจเปลี่ยนใหม่ทุกวัน ความคืบหน้าของวันนี้จะถูกบันทึกไว้</div></section>`}
function goodTree(){return '<section class="panel"><h2>🥬 สวนปลูกผัก</h2><p class="muted">ปลูก เก็บเกี่ยว และสะสมเหรียญกับ EXP</p><button class="btn green" onclick="go(\'garden\')">🌿 เข้าสวนปลูกผัก</button></section>'}function cropTime(ms){if(ms<=0)return 'พร้อมเก็บเกี่ยว!';const m=Math.floor(ms/60000),sec=Math.floor(ms%60000/1000);return m+' นาที '+String(sec).padStart(2,'0')+' วินาที'}function garden(){if(!user)ensureGuest();ensurePlayerData();const plots=user.gardenPlots.map((plot,i)=>{if(!plot)return '<button class="garden-plot" onclick="openSeedPicker('+i+')"><div class="soil">＋</div><strong>แปลงว่าง</strong><small>แตะเพื่อเลือกเมล็ดปลูก</small></button>';const crop=gardenCrops.find(x=>x.id===plot.cropId)||gardenCrops[0],left=plot.readyAt-Date.now(),ready=left<=0;return '<button class="garden-plot" '+(ready?'onclick="harvestCrop('+i+')"':'disabled')+'><div class="soil">'+(ready?crop.icon:(left<plot.duration*.7?'🌱':'🌿'))+'</div><strong>'+crop.name+'</strong><small>'+(ready?'โตเต็มที่แล้ว · แตะเก็บเกี่ยว':cropTime(left))+'</small>'+(ready?'<span class="garden-sickle">🌾</span>':'')+'</button>'}).join('');return '<main class="page"><section class="garden-shell"><div class="garden-fence"></div><div class="garden-content"><div class="row spread"><div><h1>🌿 สวนปลูกผัก</h1><p>ดูแลแปลงผัก แล้วเก็บเกี่ยวเมื่อโตเต็มที่</p></div><div class="row"><span class="coin-chip">🪙 '+user.coins+' เหรียญ</span><button class="btn ghost" onclick="go(\'home\')">← Menu</button></div></div><div class="garden-layout"><aside class="seed-shop"><h2>🛒 ร้านเมล็ดพันธุ์</h2><p class="muted">แตะแปลงเพื่อเลือกเมล็ด · มีเมล็ด '+Object.values(user.gardenSeeds).reduce((a,b)=>a+(Number(b)||0),0)+' ถุง</p>'+gardenCrops.map(c=>'<button class="btn ghost" onclick="buySeed(\''+c.id+'\')"><span>'+c.icon+' '+c.name+'<small>'+c.rarity+' · '+c.minutes+' นาที</small></span><b>🪙 '+c.price+'</b></button>').join('')+'</aside><div class="garden-house"><h2>🌱 แปลงปลูกของฉัน</h2><div class="plots">'+plots+'</div><p class="garden-note">เมล็ดที่ซื้อเก็บไว้ได้ • เวลาปลูกเดินต่อแม้ออกจากเกม</p></div></div></div></section></main>'}function openSeedPicker(i){window.seedPlot=i;const old=document.querySelector('#seedPicker');old?.remove();const bg=document.createElement('div');bg.className='modal-bg';bg.id='seedPicker';bg.innerHTML='<section class="modal garden-seed-modal"><div class="row spread"><div><h2>🌱 เลือกเมล็ดปลูก</h2><p class="muted">เมล็ดที่มีจะนำไปปลูกทันที ส่วนที่ยังไม่มีซื้อได้ที่นี่</p></div><button class="btn ghost" onclick="closeSeedPicker()">ปิด</button></div>'+gardenCrops.map(c=>{const n=Number(user.gardenSeeds[c.id])||0;return '<div class="crop-choice"><span style="font-size:34px">'+c.icon+'</span><div><b>'+c.name+' · '+c.rarity+'</b><br><small>โตใน '+c.minutes+' นาที · เก็บขายได้ '+c.sale+' เหรียญ · +'+c.exp+' EXP · มี '+n+' ถุง</small></div><button class="btn '+(n?'green':'gold')+' small" onclick="'+(n?'plantCrop('+i+',\''+c.id+'\')':'buyAndPlant('+i+',\''+c.id+'\')')+'">'+(n?'ปลูก':'ซื้อ '+c.price+' 🪙')+'</button></div>'}).join('')+'</section>';document.body.appendChild(bg)}function closeSeedPicker(){document.querySelector('#seedPicker')?.remove()}function buySeed(id){const c=gardenCrops.find(x=>x.id===id);if(!c)return;if(user.coins<c.price){toast('เหรียญไม่พอซื้อเมล็ดนี้');return}user.coins-=c.price;user.gardenSeeds[id]=(Number(user.gardenSeeds[id])||0)+1;save();if(document.querySelector('#seedPicker'))openSeedPicker(window.seedPlot);else render();toast('ซื้อเมล็ด'+c.name+'แล้ว')}function buyAndPlant(i,id){const c=gardenCrops.find(x=>x.id===id);if(!c||user.coins<c.price){toast('เหรียญไม่พอซื้อเมล็ดนี้');return}user.coins-=c.price;user.gardenSeeds[id]=(Number(user.gardenSeeds[id])||0)+1;plantCrop(i,id)}function plantCrop(i,id){const c=gardenCrops.find(x=>x.id===id);if(!c||user.gardenPlots[i])return;if((Number(user.gardenSeeds[id])||0)<1){toast('ยังไม่มีเมล็ดนี้');return}user.gardenSeeds[id]--;const duration=c.minutes*60000;user.gardenPlots[i]={cropId:id,plantedAt:Date.now(),duration,readyAt:Date.now()+duration};closeSeedPicker();save();render();toast('ปลูก'+c.name+'แล้ว รอให้โตเต็มที่นะ 🌱')}function harvestCrop(i){const p=user.gardenPlots[i];if(!p||Date.now()<p.readyAt)return;const c=gardenCrops.find(x=>x.id===p.cropId);if(!c)return;const cropCoins=grantCoins(c.sale);const ups=grantExperience(c.exp);user.gardenPlots[i]=null;save();render();const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML='<section class="modal" style="text-align:center"><div style="font-size:76px">'+c.icon+'</div><h1>เก็บเกี่ยวสำเร็จ!</h1><p>ผักที่ปลูก: <b>'+c.name+'</b></p><p>ขายได้ 🪙 <b>'+cropCoins+' เหรียญ</b></p><p>ได้รับ ⭐ <b>'+c.exp+' EXP</b>'+(ups?' · เลเวล '+user.level+' แล้ว!':'')+'</p><button class="btn gold" onclick="this.closest(\'.modal-bg\').remove()">เยี่ยมเลย</button></section>';document.body.appendChild(bg)}function updateGardenTimers(){if(page!=='garden')return;document.querySelectorAll('.garden-plot').forEach((el,i)=>{const p=user?.gardenPlots?.[i];if(!p)return;const left=p.readyAt-Date.now();if(left<=0){render();return}const sm=el.querySelector('small');if(sm)sm.textContent=cropTime(left)})}function outfitIcons(){return dressedCharacter()}function dressedCharacter(){ensurePlayerData();const outfit=storeItem(user?.storeEquipped?.outfit)||storeItem('starter-outfit'),rod=storeItem(user?.storeEquipped?.rod)||storeItem('starter-rod'),pet=storeItem(user?.storeEquipped?.pet);return '<span class="angler-person wearable-person"><img src="'+outfit.image+'" alt="'+esc(outfit.name)+'"></span><span class="angler-wear rod wearable-rod" title="'+esc(rod.name)+'"><img src="'+rod.image+'" alt="'+esc(rod.name)+'"></span>'+(pet?'<span class="angler-wear wearable-pet" title="'+esc(pet.name)+'">'+pet.icon+'</span>':'')}function fishArt(f){return f.image?'<img class="fish-art" src="'+f.image+'" alt="'+esc(f.name)+'">':f.icon}function chooseFish(){const loc=fishingLocations.find(item=>item.id===selectedLocation)||fishingLocations[0],pool=fishSpecies.filter(f=>loc.fishIds.includes(f.id)),luck=Math.max(0,(user?.level||1)-1)*.02,weight=f=>f.rarity==='หาง่าย'?f.weight:f.weight*(1+luck),roll=Math.random()*pool.reduce((sum,f)=>sum+weight(f),0);let sum=0;return pool.find(f=>{sum+=weight(f);return roll<sum})||pool[0]||fishSpecies[0]}function fishProgressFactor(){const base=caughtSpecies?.groundBoss?.1:caughtSpecies?.rarity==='บอส'?.3:caughtSpecies?.rarity==='อนาคต'?.3:caughtSpecies?.rarity==='อดีต'?.3:caughtSpecies?.rarity==='ไททัน'?.3:caughtSpecies?.rarity==='ชาตะ'?.2:caughtSpecies?.rarity==='บาปทั้ง7'?.5:caughtSpecies?.rarity==='ตำนาน'?.55:caughtSpecies?.rarity==='ผิดปกติ'?.25:caughtSpecies?.rarity==='แรร์มาก'?.7:caughtSpecies?.rarity==='หายาก'?.9:1;return base*(1+(Math.max(0,(user?.level||1)-1)+currentStoreBonus())*.01)*(caughtSpecies?.afterimage&&performance.now()<osuSlowUntil?.35:1)}function fishNoteWindow(){return 2000*(caughtSpecies?.struggle&&miniMode!=='bar'?.55:1)}
function catchFish(){ensurePlayerData();caughtSpecies ||= chooseFish();user.fishCollection[caughtSpecies.id]=(user.fishCollection[caughtSpecies.id]||0)+1;questProgress('caught');playSound('catch')}
function playSound(kind){if(!user||(user.soundEnabled===false&&kind!=='bite'))return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx ||= new AC();if(audioCtx.state==='suspended')audioCtx.resume();const notes=kind==='bite'?[1046.5,1318.5]:kind==='catch'?[660,880,1100]:kind==='right'?[880,1175]:kind==='wrong'?[300,220]:[440,550];notes.forEach((hz,i)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),t=audioCtx.currentTime+i*.09;osc.type=kind==='wrong'?'sine':kind==='bite'?'sine':'triangle';osc.frequency.setValueAtTime(hz,t);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(kind==='bite'?.055:.07,t+.02);gain.gain.exponentialRampToValueAtTime(.0001,t+.2);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.22)})}catch{}}function toggleSound(){if(!user)ensureGuest();ensurePlayerData();user.soundEnabled=!user.soundEnabled;save();render();toast(user.soundEnabled?'🔊 เปิดเสียงแล้ว':'🔇 ปิดเสียงแล้ว')}
function collection(){if(!user)ensureGuest();fishbookOpen=true;return fishbookMarkup()}function equipItem(id){ensurePlayerData();const it=outfitItems.find(x=>x.id===id);if(it&&user.unlocked.includes(id)){user.equipped[it.slot]=id;save();render();toast(`สวมใส่${it.name}แล้ว`)}}

'firstName',user.firstName)+input('นามสกุล','lastName',user.lastName)+input('ชื่อเล่น','nickname',user.nickname)+input('อายุ','age',user.age,'number')+input('ชื่อสถานศึกษา','school',user.school)+input('เบอร์โทรศัพท์','phone',user.phone||'-','tel',false)+'<div class="field full"><button class="btn green">บันทึกข้อมูล</button> <button type="button" class="btn ghost" onclick="editing=false;render()">ยกเลิก</button></div></form></section></main>';return '<main class="page"><section class="panel"><div class="row spread"><h1>👤 โปรไฟล์</h1><button class="btn ghost" onclick="go(\'home\')">← กลับ Menu</button></div>'+scores()+levelProgressMarkup()+dailyBoard()+'<div class="row" style="justify-content:center"><span class="score">🪙 เหรียญ <b>'+user.coins+'</b></span></div><div class="row"><div class="avatar garden-profile-avatar">🧒🏻</div><div><h2>'+esc(user.nickname||user.firstName)+' '+(user.age?'<small>อายุ '+esc(user.age)+' ปี</small>':'')+'</h2><div>'+esc(user.firstName)+' '+esc(user.lastName)+'</div><div class="muted">'+esc(user.email)+'</div><div class="muted">'+esc(user.school||'')+' · '+esc(user.grade||'')+' · โทร. '+esc(user.phone||'-')+'</div></div></div><div class="grid" style="margin-top:18px"><div class="score">❤️ กิจกรรมที่แชร์ <b>'+user.activities.length+'</b></div><div class="score">💚 แต้มความดี <b>'+kindScore()+'</b></div></div><div class="row" style="margin-top:22px"><button class="btn gold" onclick="editing=true;render()">✏️ แก้ไขข้อมูล</button><button class="btn ghost" onclick="go(\'home\')">กลับ Menu</button><button class="btn" onclick="logout()">ออกจากระบบ</button></div></section></main>'}function input(label,name,value='',type='text',required=true){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${name==='age'?'min="1" max="120"':''}></div>`}

function prepare(){const loc=fishingLocations.find(item=>item.id===selectedLocation)||fishingLocations[0];return `<main class="page prepare-page"><section class="panel prepare-panel"><div class="prepare-toolbar"><div class="location-picker"><button type="button" class="btn ghost location-trigger" aria-haspopup="menu" aria-expanded="${locationPickerOpen}" onclick="toggleLocationMenu()">📍 สถานที่ตกปลา · ${esc(loc.name)}　⌄</button>${locationPickerMarkup()}</div><div class="row"><button class="btn ghost" onclick="go('home')">← Menu</button><button class="btn small" onclick="go('profile')">👤 Profile</button></div></div><img class="location-hero" src="${loc.image}" alt="สถานที่ตกปลา: ${esc(loc.name)}"><h1 class="prepare-title">🎣 พร้อมออกผจญภัยไหม?</h1><p class="prepare-subtitle">เลือกสถานที่ แล้วเตรียมออกไปตกปลาและเรียนรู้เรื่องราวของความดี</p>${scores()}${levelProgressMarkup()}<div class="prepare-actions"><div class="prepare-tools"><button class="btn ghost fishbook-launch" onclick="openFishbook()">📘 สมุดสะสมปลา</button><button class="btn ghost" onclick="openHowTo()">📖 วิธีการเล่น</button></div><button class="btn gold prepare-start-button" onclick="go('mini')">🎣 เริ่มตกปลา</button></div></section>${fishbookMarkup()}</main>`}function mini(){ensurePlayerData();if(fishState==='ready')return `<main class="mini-game-page"><section class="meter mini-idle"><div class="mini-wait-icon">🎣</div><h1>พร้อมตกปลาไหม?</h1><p>กดเริ่มแล้วรอปลากินเบ็ด</p><button class="btn gold" onclick="startFishing()">🎣 เริ่มตกปลา</button><div class="mini-tools"><button class="btn ghost fishbook-launch mini-fishbook-launch" onclick="openFishbook()">📘 สมุดสะสมปลา</button><button class="btn ghost" onclick="openHowTo()">📖 วิธีการเล่น</button></div></section>${fishbookMarkup()}</main>`;if(fishState==='waiting')return '<main class="mini-game-page"><section class="meter mini-idle waiting"><div class="mini-wait-icon">🫧</div><h1>กำลังรอปลากินเบ็ด…</h1><p>เงียบ ๆ แล้วรอฟังเสียงติ๊งนะ</p></section></main>';return '<main class="mini-game-page">'+miniGameMarkup()+'</main>'}function activities(){if(!user)return authRequired();let cards=user.activities.map(a=>`<article class="activity">${a.image?`<img src="${a.image}" alt="รูปกิจกรรม">`:`<div class="placeholder">💚</div>`}<div><span class="badge">💚 +5 แต้มความดี</span><h2>${esc(a.description)}</h2><div>📍 ${esc(a.place||'ไม่ได้ระบุสถานที่')}　📅 ${esc(a.date)}</div></div></article>`).join('');return `<main class="page"><section class="panel"><div class="row spread"><div><h1>❤️ กิจกรรมทำความดี</h1><p class="muted">เรื่องเล็ก ๆ ที่ส่งต่อความสุขให้กัน</p></div><button class="btn ghost" onclick="go('home')">← กลับ Menu</button></div>${scores()}<button class="btn green" onclick="go('addActivity')">＋ เพิ่มกิจกรรม</button><div style="margin-top:18px">${cards||'<div class="notice">ยังไม่มีรายการกิจกรรม ลองแบ่งปันความดีครั้งแรกของคุณนะ 🌱</div>'}</div></section></main>`}
function addActivity(){if(!user)return authRequired();return `<main class="page"><section class="panel form"><div class="row spread"><h1>➕ เพิ่มกิจกรรมทำความดี</h1><button class="btn ghost" onclick="go('activities')">← กลับกิจกรรม</button></div><form class="grid" onsubmit="addGood(event)"><div class="field full"><label>📷 รูปภาพกิจกรรม</label><input name="photo" type="file" accept="image/*" required></div><div class="field full"><label>1. กิจกรรมที่ทำ *</label><input name="title" maxlength="160" required placeholder="เช่น ช่วยเก็บขยะบริเวณโรงเรียน"></div><div class="field full"><label>3. อธิบายความประทับใจ *</label><textarea name="reflection" maxlength="400" required placeholder="เล่าความรู้สึกหรือความประทับใจจากการทำกิจกรรม..."></textarea></div>${input('📍 สถานที่','place')}${input('📅 วันที่','date',new Date().toISOString().slice(0,10),'date')}<div class="field full"><button class="btn green">เสร็จสิ้น · รับ +5 แต้ม</button></div></form></section></main>`}
function render(){if(user&&!user.isGuest&&!db.users.find(x=>x.email===user.email)){user=null;db.current=null}ensurePlayerData();if(page==='mini'&&!user)ensureGuest();const views={home,profile,register,login,prepare,mini,activities,addActivity,collection,garden,shop};$('#app').innerHTML=header()+(views[page]||home)()+howToMarkup();if(page==='mini'&&gameOn){if(caughtSpecies?.fallingLeaves)$('#fishingTrack')?.classList.add('has-leaves');startLoop()}}
function signup(e){e.preventDefault();let f=new FormData(e.target),email=String(f.get('email')).trim().toLowerCase();if(db.users.some(x=>x.email===email))return $('#formmsg').innerHTML='<div class="notice">อีเมลนี้มีบัญชีแล้ว กรุณาเข้าสู่ระบบ</div>';user={firstName:f.get('firstName'),lastName:f.get('lastName'),nickname:f.get('nickname'),age:f.get('age'),email,password:f.get('password'),gameScore:db.guest?.gameScore||0,kindScore:db.guest?.kindScore||0,level:db.guest?.level||1,exp:db.guest?.exp||0,school:f.get('school'),grade:f.get('grade'),phone:f.get('phone'),activities:db.guest?.activities||[],fishCollection:db.guest?.fishCollection||{},coins:db.guest?.coins||0,gardenSeeds:db.guest?.gardenSeeds||{},gardenPlots:db.guest?.gardenPlots||[null,null],badges:db.guest?.badges||[],unlocked:db.guest?.unlocked||[],equipped:db.guest?.equipped||{},daily:db.guest?.daily||null,soundEnabled:db.guest?.soundEnabled!==false};db.current=email;db.users.push(user);db.guest=null;save();go('home');toast('สมัครสมาชิกสำเร็จ 🌱')}
function signin(e){e.preventDefault();let f=new FormData(e.target),id=String(f.get('loginId')||'').trim().toLowerCase(),u=db.users.find(x=>(x.email===id||String(x.nickname||'').toLowerCase()===id)&&x.password===f.get('password'));if(!u)return $('#formmsg').innerHTML='<div class="notice">อีเมลหรือรหัสผ่านไม่ถูกต้อง</div>';user=u;db.current=u.email;save();go('home');toast('ยินดีต้อนรับกลับมา ✨')}
function logout(){stopFishing();user=null;db.current=null;save();go('home');toast('ออกจากระบบแล้ว')}
function updateProfile(e){e.preventDefault();let f=new FormData(e.target);for(let k of ['firstName','lastName','nickname','age','school','grade','phone'])user[k]=f.get(k);save();editing=false;render();toast('บันทึกข้อมูลแล้ว')}
function addGood(e){e.preventDefault();const f=new FormData(e.target),file=f.get('photo');const finalize=image=>{user.activities.unshift({description:f.get('title')+' — '+f.get('reflection'),place:f.get('place'),date:f.get('date'),image,created:Date.now()});user.kindScore+=5;const shareCoins=2+Math.floor(Math.random()*4);const gotShareCoins=grantCoins(shareCoins);grantExperience(5);questProgress('activity');save();go('activities');toast('เพิ่มกิจกรรมแล้ว รับ +5 แต้ม · +5 EXP · +'+gotShareCoins+' เหรียญ 💚')};if(file&&file.size){const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,700/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);finalize(c.toDataURL('image/jpeg',.72))};im.src=reader.result};reader.readAsDataURL(file)}else finalize('')}

function moveZone(d){if(page!=='mini'||!gameOn)return;zoneX=Math.max(0,Math.min(.78,zoneX+d));updateFishing()}
function startFishing(){if(page!=='mini'||answered||fishState!=='ready')return;ensureGuest();caughtSpecies=null;startMusic('calm');fishState='waiting';miniMode=null;gameOn=false;holding=false;drainProgress=false;progress=0;fallingLeaves=[];leafElapsed=0;gameElapsed=0;hasProgressStarted=false;render();try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){audioCtx ||= new AC();audioCtx.resume()}}catch{}playSound('water');biteTimer=setTimeout(beginRandomGame,3000+Math.random()*2000)}
function beginRandomGame(){biteTimer=null;if(page!=='mini'||fishState!=='waiting')return;caughtSpecies=chooseFish();miniMode=caughtSpecies?.lockBar?'bar':caughtSpecies?.lockOsu?'osu':['bar','osu','arrows'][Math.floor(Math.random()*3)];fallingLeaves=[];leafElapsed=0;gameElapsed=0;hasProgressStarted=false;mouthElapsed=0;bloodElapsed=0;bloodMarks=[];abyssSlashElapsed=0;abyssSlashes=[];abyssSlashHits=0;koiEndEnraged=false;hammerElapsed=0;hammerMarks=[];osuSlowUntil=0;fakePressCount=0;futureSignalElapsed=0;futureSignals=[];fishState='playing';gameOn=true;holding=false;drainProgress=false;progress=0;fishX=.5;fishTargetX=.5;fishTargetAge=0;zoneX=.39;osuStep=0;osuPositions=makeOsuPositions();arrowSequence=makeArrowSequence();arrowIndex=0;previousArrow=null;noteDeadline=performance.now()+fishNoteWindow();startMusic(caughtSpecies?.music||(caughtSpecies?.boss?'boss':'calm'));playSound('bite');render()}
function makeArrowSequence(){const dirs=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];return Array.from({length:8},()=>dirs[Math.floor(Math.random()*dirs.length)])}
function makeOsuPositions(){const spots=[[15,25],[50,24],[84,25],[28,72],[72,72],[50,52],[18,72],[82,72]];for(let i=spots.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[spots[i],spots[j]]=[spots[j],spots[i]]}return spots.slice(0,5)}
function arrowGlyph(k){return ({ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→'})[k]||'·'}
function advanceArrow(){previousArrow=arrowSequence[arrowIndex];arrowIndex++;if(arrowIndex>=arrowSequence.length){arrowSequence=makeArrowSequence();arrowIndex=0}}

st title=redBoss?'🧜 กดปุ่มที่สว่าง ปุ่มหลอกจะหักความคืบหน้า':'🥁 กดหมายเลขเรียงตามลำดับ';const hint=startFish?'ระวังภาพปุ่มซ้อน ปุ่มหลอกจะลดแรงเพิ่มหลอด 5 วินาที':'ปุ่มของบอสไม่มีเลข ปุ่มจริงจะสว่างและเกิดใหม่เรื่อย ๆ';return '<section class="meter"><div class="meter-top"><b>'+title+'</b><span>'+hint+'</span></div><div class="osu-board '+(redBoss?'osu-hidden-number':'')+'">'+targets+'</div>'+renderMiniProgress()+'<div class="smallnote">'+(redBoss?'กดปุ่มที่สว่าง • ปุ่มสีเข้มเป็นปุ่มหลอก':'กดปุ่มตามเลขที่สว่าง • ถนัดคีย์บอร์ดกดเลข 1–5 ได้')+'</div></section>'}const current=arrowSequence[arrowIndex]||'ArrowUp';return '<section class="meter"><div class="meter-top"><b>🧭 กดลูกศรให้ตรง</b><span>กดลูกศรตรงกลางภายใน 2 วินาที</span></div><div class="arrow-lane"><div class="arrow-previous">'+arrowGlyph(previousArrow)+'</div><div class="arrow-current" id="arrowCurrent">'+arrowGlyph(current)+'<span class="arrow-timer" id="arrowTimer"></span></div></div>'+renderMiniProgress()+'<div class="arrow-pad" aria-label="ปุ่มลูกศรสำหรับมือถือ"><button onclick="pressArrow(\'ArrowUp\')" aria-label="ขึ้น">↑</button><div><button onclick="pressArrow(\'ArrowLeft\')" aria-label="ซ้าย">←</button><button onclick="pressArrow(\'ArrowDown\')" aria-label="ลง">↓</button><button onclick="pressArrow(\'ArrowRight\')" aria-label="ขวา">→</button></div></div><div class="smallnote">คอมพิวเตอร์กดปุ่มลูกศร • มือถือใช้ปุ่มด้านล่าง</div></section>'}function updateAbyssHazards(dt){
if(caughtSpecies?.blackSlashes){
 abyssSlashElapsed+=dt;
 if(abyssSlashElapsed>=2){abyssSlashElapsed-=2;abyssSlashes.push({x:.1+Math.random()*.8,age:0,struck:false})}
 const center=zoneX+.1225,next=[];
 for(const slash of abyssSlashes){slash.age+=dt;if(slash.age>=2&&!slash.struck){slash.struck=true;if(Math.abs(center-slash.x)<.15){abyssSlashHits++;if(abyssSlashHits>=9)koiEndEnraged=true}}if(slash.age<2.28)next.push(slash)}

}

 hammerElapsed+=dt;
 if(hammerElapsed>=4){hammerElapsed-=4;hammerMarks.push({side:Math.random()<.5?'left':'right',age:0,struck:false})}
 const next=[];
 for(const mark of hammerMarks){mark.age+=dt;if(mark.age>=2&&!mark.struck){mark.struck=true;const overlap=mark.side==='left'?zoneX<.5:zoneX+.245>.5;if(overlap){progress=Math.max(0,progress-40);playSound('wrong')}}if(mark.age<2.32)next.push(mark)}
 hammerMarks=next
}
if(caughtSpecies?.futureSignal){
 futureSignalElapsed+=dt;
 if(futureSignalElapsed>=3){futureSignalElapsed-=3;futureSignals.push({x:.08+Math.random()*.84,age:0,fired:false})}

 for(const signal of futureSignals){signal.age+=dt;if(signal.age>=2&&!signal.fired){signal.fired=true;if(Math.abs(center-signal.x)<.14){progress=Math.max(0,progress-25);playSound('wrong')}}if(signal.age<2.5)next.push(signal)}

 layer.innerHTML=html
}
}function startLoop(){if(fishTimer||!gameOn)return;let last=0;const frame=now=>{if(!gameOn){fishTimer=null;return}const dt=Math.min(.05,Math.max(0,(now-(last||now))/1000));last=now;gameElapsed+=dt;if(miniMode==='bar'){updateAbyssHazards(dt);if(caughtSpecies?.mouthBoss){const center=zoneX+.12,nearMouth=center<.17||center>.83;if(nearMouth){mouthElapsed+=dt;if(mouthElapsed>=2){progress=Math.max(0,progress-30);mouthElapsed=0;playSound('wrong')}}else mouthElapsed=0}if(caughtSpecies?.bloodBoss){bloodElapsed+=dt;if(bloodElapsed>=1.5){bloodElapsed-=1.5;bloodMarks.push({x:.08+Math.random()*.84,age:0,struck:false})}const center=zoneX+.12,next=[];for(const mark of bloodMarks){mark.age+=dt;if(mark.age>=2&&!mark.struck){mark.struck=true;if(Math.abs(center-mark.x)<.14){progress=Math.max(0,progress-20);playSound('wrong')}}if(mark.age<2.25)next.push(mark)}bloodMarks=next;const hazardLayer=document.querySelector('#bossHazardLayer');if(hazardLayer)hazardLayer.innerHTML=bloodMarks.map(mark=>'<img class="blood-mark '+(mark.age>=1.6?'warning':'')+(mark.struck?' strike':'')+'" style="left:'+(mark.x*100)+'%;top:50%;opacity:'+Math.min(1,.28+mark.age*.38)+'" src="assets/effects/polluted-lake/boss-blood-slash.png" alt="รอยฟัน">').join('')}if(!koiEndEnraged){fishTargetAge+=dt;const fishMoveInterval=caughtSpecies?.id==='sea-dragon-boss'?.24:.75;if(fishTargetAge>=fishMoveInterval){fishTargetAge=0;fishTargetX=.04+Math.random()*.92}const fishEase=1-Math.exp((caughtSpecies?.id==='sea-dragon-boss'?-7:-2.7)*dt);fishX+=(fishTargetX-fishX)*fishEase;zoneX=Math.max(0,Math.min(.78,zoneX+(holding?.72:-.42)*dt))}if(koiEndEnraged)progress=Math.max(0,progress-14*dt);else if(fishX>=zoneX-.025&&fishX<=zoneX+.245)progress=Math.min(100,progress+23.33*dt*fishProgressFactor()*1.5);else progress=Math.max(0,progress-(caughtSpecies?.struggle?16:5)*dt);if(caughtSpecies?.fallingLeaves){leafElapsed+=dt;if(leafElapsed>=2){leafElapsed-=2;fallingLeaves.push({x:8+Math.random()*84,y:0,hit:false})}fallingLeaves=fallingLeaves.map(l=>({...l,y:l.y+42*dt})).filter(l=>l.y<105);const center=(zoneX+.12)*100;for(const leaf of fallingLeaves){if(!leaf.hit&&leaf.y>=42&&leaf.y<=58&&Math.abs(leaf.x-center)<7){leaf.hit=true;progress=Math.max(0,progress-10);playSound('wrong')}}const layer=document.querySelector('#leafLayer');if(layer)layer.innerHTML=fallingLeaves.filter(l=>l.y<100).map(l=>'<span class="falling-leaf" style="left:'+l.x+'%;top:'+l.y+'%">🍃</span>').join('')}}else{if(now>=noteDeadline){drainProgress=true;if(miniMode==='osu'){osuStep++;if(osuStep>=5){osuStep=0;osuPositions=makeOsuPositions()}}else advanceArrow();noteDeadline=now+fishNoteWindow();render()}if(drainProgress)progress=Math.max(0,progress-(caughtSpecies?.struggle?18:7)*fishProgressFactor()*dt);if(miniMode==='osu'){const ring=document.querySelector('.osu-target.active .osu-ring');if(ring){const t=Math.max(0,(noteDeadline-now)/fishNoteWindow());ring.style.transform='scale('+(.78+1.12*t)+')'}}else{const timer=document.querySelector('#arrowTimer');if(timer)timer.style.transform='scaleX('+Math.max(0,(noteDeadline-now)/fishNoteWindow())+')'}}if(progress>0)hasProgressStarted=true;if(progress<=0&&(hasProgressStarted||(miniMode!=='bar'&&drainProgress)||gameElapsed>=8)){loseFish();return}updateFishing();if(progress>=100){finishFishing();return}fishTimer=requestAnimationFrame(frame)};fishTimer=requestAnimationFrame(frame)}function updateFishing(){let inside=fishX>=zoneX-.025&&fishX<=zoneX+.245;let tf=$('#trackfish');if(tf){tf.style.left=(fishX*100)+'%';tf.classList.toggle('in-zone',inside)}let track=$('#fishingTrack');if(track)track.classList.toggle('has-fish',inside);let z=$('#trackzone');if(z)z.style.left=(zoneX*100)+'%';let p=$('#progress'),pct=$('#pct');if(p)p.style.width=progress+'%';if(pct)pct.textContent=Math.round(progress)+'%'}
function osuDecoy(){if(page!=='mini'||!gameOn||!caughtSpecies?.afterimage)return;osuSlowUntil=performance.now()+5000;fakePressCount++;playSound('wrong');drainProgress=false;if(fakePressCount>3){fakePressCount=0;progress=Math.max(0,progress-50);hasProgressStarted=true;toast('กดปุ่มหลอกครบ 4 ครั้ง · ความคืบหน้าลด 50%')}else toast('ปุ่มหลอก! แรงเพิ่มความคืบหน้าลดลง 5 วินาที');updateFishing()}function osuHit(i){if(page!=='mini'||!gameOn||miniMode!=='osu')return;if(caughtSpecies?.numberless){if(i===osuStep){progress=Math.min(100,progress+20*fishProgressFactor()*1.5);drainProgress=false;playSound('right');osuPositions=makeOsuPositions();osuStep=Math.floor(Math.random()*osuPositions.length)}else{progress=Math.max(0,progress-15);drainProgress=false;hasProgressStarted=true;playSound('wrong')}noteDeadline=performance.now()+fishNoteWindow();if(progress>=100){finishFishing();return}render();return}if(i===osuStep&&performance.now()<=noteDeadline){progress=Math.min(100,progress+20*fishProgressFactor()*1.5);drainProgress=false;playSound('right');osuStep++;if(osuStep>=5){osuStep=0;osuPositions=makeOsuPositions()}noteDeadline=performance.now()+fishNoteWindow();if(progress>=100){finishFishing();return}render()}else{progress=Math.max(0,progress-5);drainProgress=true;hasProgressStarted=true;playSound('wrong');updateFishing()}}
function pressArrow(dir){if(page!=='mini'||!gameOn||miniMode!=='arrows')return;if(dir===arrowSequence[arrowIndex]){advanceArrow();progress=Math.min(100,progress+12.5*fishProgressFactor()*1.5);drainProgress=false;playSound('right')}else{advanceArrow();progress=Math.max(0,progress-5);drainProgress=true;hasProgressStarted=true;playSound('wrong')}noteDeadline=performance.now()+fishNoteWindow();if(progress>=100){finishFishing();return}render()}
function loseFish(){stopFishing();caughtSpecies=null;progress=0;fallingLeaves=[];render();toast('โอ่ไม่น่ะปลาหลุดไปแล้ว')}function finishFishing(){stopFishing();fishState='ready';miniMode=null;holding=false;drainProgress=false;progress=0;render();openQuestion()}
function stopFishing(){if(biteTimer){clearTimeout(biteTimer);biteTimer=null}if(fishTimer){cancelAnimationFrame(fishTimer);fishTimer=null}gameOn=false;holding=false;fishState='ready';miniMode=null;drainProgress=false}function openQuestion(){catchFish();document.querySelector('.pond')?.classList.add('celebrate');let i;do{i=Math.floor(Math.random()*questions.length)}while(questions.length>1&&i===lastQ);lastQ=i;modalQuestion=questions[i];answered=false;drawQuestion()}

tem;window.closeStoreItem=closeStoreItem;window.buyOrEquipStoreItem=buyOrEquipStoreItem;window.openSeedPicker=openSeedPicker;window.closeSeedPicker=closeSeedPicker;window.buySeed=buySeed;window.buyAndPlant=buyAndPlant;window.plantCrop=plantCrop;window.harvestCrop=harvestCrop;setInterval(updateGardenTimers,1000);
document.addEventListener('contextmenu',e=>{if(e.target.closest('.mini-game-page'))e.preventDefault()});window.addEventListener('pointerdown',e=>{if(page==='mini'&&gameOn&&miniMode==='bar'&&!e.target.closest('button,a,input,textarea,select')){holding=true;e.preventDefault()}});window.addEventListener('pointerup',()=>{holding=false});window.addEventListener('pointercancel',()=>{holding=false});window.addEventListener('blur',()=>{holding=false});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&helpOpen){closeHowTo();return}if(e.key==='Escape'&&fishbookOpen){closeFishbook();return}if(page!=='mini'||!gameOn)return;if(miniMode==='bar'){if(e.key==='ArrowRight'){e.preventDefault();holding=true}if(e.key==='ArrowLeft'){e.preventDefault();holding=false;moveZone(-.05)}}else if(miniMode==='arrows'&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();if(!e.repeat)pressArrow(e.key)}else if(miniMode==='osu'&&/^[1-5]$/.test(e.key)){e.preventDefault();if(!e.repeat)osuHit(Number(e.key)-1)}});window.addEventListener('keyup',e=>{if(page==='mini'&&miniMode==='bar'&&e.key==='ArrowRight')holding=false});function routeFromLocation(){const h=location.hash.slice(1);if(h){page=h;return}const n=location.pathname.split('/').pop();page=({'register.html':'register','waiting-game.html':'login','share.html':'activities','game.html':'mini'})[n]||'home'}window.addEventListener('popstate',()=>{routeFromLocation();render()});routeFromLocation();render();
